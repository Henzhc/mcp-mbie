# Build the MCP server image and deploy it to the Azure Container App - mcp-mbie.
# Replaces the previous Azure App Service (B1) deployment; the app now runs as a
# scale-to-zero Container App in mcp-mbie-rg-au using the shared registry.
#
# Requires the CI service principal (same OIDC federated credential as before) to have:
#   - AcrPush on the montarnetoolboxreg registry
#   - Contributor on the mcp-mbie container app
name: Build and deploy to Azure Container App - mcp-mbie

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: montarnetoolboxreg.azurecr.io
  IMAGE: mcp-mbie
  RESOURCE_GROUP: mcp-mbie-rg-au
  CONTAINER_APP: mcp-mbie

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for the OIDC login
      contents: read    # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BAA9714478C6420481F0A4CA0545F157 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FC6191E4EED94921B7A15883F11680D9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8C0868A315E147C38BFBB6BCD4F1BF68 }}

      - name: Build and push image
        run: |
          az acr login --name montarnetoolboxreg
          docker build -t $REGISTRY/$IMAGE:${{ github.sha }} -t $REGISTRY/$IMAGE:latest .
          docker push $REGISTRY/$IMAGE:${{ github.sha }}
          docker push $REGISTRY/$IMAGE:latest

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/$IMAGE:${{ github.sha }}
